# Deploy del frontend en Netlify. La variable REACT_APP_API_URL (URL de Render)
# se carga en Site configuration → Environment variables.
[build]
  base = "client"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# React Router maneja las rutas en el navegador: cualquier URL (/productos/:id,
# /carrito, /admin/...) tiene que devolver index.html para no dar 404 al recargar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
